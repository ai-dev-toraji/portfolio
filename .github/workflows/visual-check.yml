# 見た目の自動チェック
#
# AI が作った修正ブランチについて、Vercel のプレビューを develop のプレビューと
# 見比べ、結果を依頼の Issue に1つのコメントとして書き込む。
#
# 🔴 起点は「push」ではなく「fix-request からの呼び出し」である。
#    AI の push はワークフローを起動しない（GitHub が無限ループを防ぐため、
#    ワークフロー自身の資格情報による push ではイベントを発生させない）。
#    2026-09-05 の実地検証で、修正ブランチにこのファイルが入っていても
#    起動しないことを確認した。そのため fix-request.yml から続けて呼び出す。
#
# 🔴 このファイルは既定ブランチ（main）に無いと呼び出せない。
#    呼び出し側の fix-request.yml が main で動くため、
#    `./.github/workflows/visual-check.yml` は main の内容として解決される。
#
# 前提: リポジトリの Secrets に BASIC_AUTH_USER / BASIC_AUTH_PASSWORD があること
#       （プレビューはアプリ側の Basic 認証で守られているため）

name: visual-check

on:
  workflow_call:
    inputs:
      branch:
        description: "検査する修正ブランチ"
        required: true
        type: string
      issue_number:
        description: "結果を書き込む依頼の番号"
        required: true
        type: string
      cost_usd:
        description: "AI の今回の作業量（米ドル）。取り出せなかった場合は空のまま"
        required: false
        type: string
    # 🔴 呼び出し元が自動で取り込んでよいかを判断するための唯一の値。
    #    ここを宣言しないと、ジョブ側で outputs を書いても呼び出し元には届かない。
    outputs:
      mergeable:
        description: "自動で取り込んでよいと判定されたか（true / それ以外）"
        value: ${{ jobs.check.outputs.mergeable }}
  # 手で試せるようにしておく（原因調べのときに要る）
  workflow_dispatch:
    inputs:
      branch:
        description: "検査する修正ブランチ"
        required: true
        type: string
      issue_number:
        description: "結果を書き込む依頼の番号"
        required: true
        type: string

concurrency:
  group: visual-check-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 🔴 自動で取り込んでよいかは、この出力だけで判断すること。
    #    ジョブの成否（緑か赤か）で判断してはいけない。ジョブは画面のエラーと
    #    検査そのものの失敗でしか赤くならず、「AI（Artificial Intelligence /
    #    人工知能）が何もしなかった」「依頼外のページが動いた」では緑のままになる。
    outputs:
      mergeable: ${{ steps.check.outputs.mergeable }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      # Vercel の作りかけを待つとき、どのコミットの結果を見るかの目印
      - name: 検査するブランチの先頭を控える
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 共通の部品を切り離していないかを見る。
      #
      # S6（実戦10件）で、5か所から使われている見出し部品をやめて中身を写し取り
      # 色を直接書き込んだ修正が、見た目の判定を通り抜けた。見た目は依頼どおり
      # なので写真の比べ合いでは原理的に捕まえられない。消えた読み込み（import）は
      # その切り離しの手がかりになるため、差分から拾って判定へ渡す。
      # 🔴 調べられなかったことを「0件だった」と報告しない。
      #    この手順が静かに空を返すと、判定は「調べたが切り離しは無かった」と
      #    読み、まとめにも断り書きが出ない。安全網が1本抜けたまま
      #    「問題なし」の顔をした報告が出る、いちばん危ない壊れ方になる。
      #    そのため成否を checked として明示し、失敗時は判定へ何も渡さない。
      - name: 消えた部品の読み込みを拾う
        id: imports
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "checked=false" >> "$GITHUB_OUTPUT"

          # 比較には共通の祖先が要る。checkout は浅いので、develop を
          # 取り直したうえで両側の履歴を祖先が見つかるまで深くする。
          # --depth だけでは refs/remotes/origin/develop が作られないことがあるため、
          # 行き先の ref を明示する。
          git fetch --no-tags --depth 50 origin +refs/heads/develop:refs/remotes/origin/develop
          for _ in 1 2 3; do
            git merge-base origin/develop HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen 100 origin +refs/heads/develop:refs/remotes/origin/develop
            git fetch --no-tags --deepen 100 origin "+HEAD:refs/remotes/origin/checked-head" || true
          done
          if ! git merge-base origin/develop HEAD >/dev/null 2>&1; then
            echo "共通の祖先が見つからないため、部品の切り離しは調べられない"
            exit 1
          fi

          # 削除された読み込みのうち、プロジェクト内の部品（@/ 始まり）だけを見る。
          # 外部パッケージの整理は切り離しの話ではないため対象外。
          #
          # 実物の書き方に合わせる:
          #   - import が複数行にまたがる（`} from "@/..."` だけの行になる）
          #   - 引用符が " と ' の両方ある
          #   - 拡張子は tsx/ts のほかに js/jsx/mjs もありうる
          DIFF=$(git diff "$(git merge-base origin/develop HEAD)" HEAD -- \
            '*.tsx' '*.ts' '*.jsx' '*.js' '*.mjs')
          extract() {
            printf '%s\n' "$DIFF" \
              | grep -E "^\\$1.*from ['\"]@/" \
              | grep -oE "['\"]@/[^'\"]+['\"]" \
              | tr -d "'\"" \
              | sort -u
          }
          # 消えたものから、同じ差分で足し直されたものを引く。
          # 読み込みの中身を書き換えただけ（1行消して1行足す）を
          # 「切り離した」と報告すると、正しい修正まで止まる。
          REMOVED=$(comm -23 <(extract -) <(extract +) || true)

          {
            echo "removed<<__FIXLANE_EOF__"
            printf '%s\n' "$REMOVED"
            echo "__FIXLANE_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "checked=true" >> "$GITHUB_OUTPUT"

          if [ -n "$REMOVED" ]; then
            echo "消えた部品の読み込み:"
            printf '%s\n' "$REMOVED"
          else
            echo "消えた部品の読み込みは無し（調べた結果）"
          fi

      - name: 依頼から対象ページを取り出す
        id: request
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 依頼の本文から、対象ページのパスを取る（「## 該当箇所」の表の「ページ」行）
          #
          # 🔴 本文全体から「最初に見つかった」見出しを拾ってはいけない。
          #    依頼者が書いたメモはコードの囲み（```）の中に入るが、その囲みは
          #    表示上の飾りであり、この sed は行の中身しか見ない。つまりメモの
          #    本文に「## 該当箇所」と、それらしい表の行を一字一句書かれると、
          #    そちらが「最初の見出し」として一致してしまい、本来のページが
          #    「依頼していない場所」として扱われる（実際に再現して確認済み）。
          #
          #    本物の見出しは、FixLane 側の組み立て順（依頼内容 → 追加の入力 →
          #    該当箇所）により、依頼者が書ける範囲より必ず後ろに置かれる。
          #    したがって「最後に見つかった」見出しを使えば、本文中に何個
          #    偽の見出しを書かれても本物だけを拾える。
          BODY="$(gh issue view "$NUMBER" --repo "$REPO" --json body --jq '.body' 2>/dev/null)"
          LAST_LINE="$(printf %s "$BODY" | grep -n '^## 該当箇所$' | tail -1 | cut -d: -f1)"
          SECTION="$([ -n "$LAST_LINE" ] && printf %s "$BODY" | sed -n "${LAST_LINE},\$p")"
          TARGET="$(printf %s "$SECTION" | sed -n 's/^| ページ | `\(.*\)` |$/\1/p' | head -1)"

          # 🔴 ここで取り出す値は依頼者が書いたものである。
          #    サイト内のパスの形をしていないものは、後続へ渡さず捨てる。
          #    捨てた場合は「対象ページ不明」となり、取り込みの可否判定は通らなくなる。
          if [ -n "$TARGET" ] &&
            { ! printf %s "$TARGET" | grep -Eq '^/[A-Za-z0-9/_.~%-]*$' ||
              printf %s "$TARGET" | grep -q '\.\.'; }; then
            echo "対象ページの形が不正なため無視します"
            TARGET=""
          fi

          echo "対象ページ: ${TARGET:-（取得できず）}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: 検査に使う道具を用意する
        working-directory: .github/scripts
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      # 安全網そのものが壊れていないかを先に確かめる。
      # 判定を出す道具が壊れたまま「問題なし」と報告するのが最悪の失敗なので、ここは止める。
      - name: 検査の道具を自己テストする
        working-directory: .github/scripts
        run: npm test

      # 依存の用意と文法チェックは分ける。同じ手順にすると、npm の取得が
      # 一時的に失敗しただけでも「文法チェックが通らなかった」と依頼者に伝わり、
      # AI（Artificial Intelligence / 人工知能）の書いたコードのせいにしてしまう。
      - name: サイト本体の依存を用意する
        id: deps
        continue-on-error: true
        run: npm ci

      - name: 文法チェック
        id: lint
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Vercel のプレビューができるまで待つ
        id: preview
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ steps.head.outputs.sha }}
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
          # Vercel のプレビュー URL は「プロジェクト名-git-ブランチ名-スコープ」で決まる
          VERCEL_SCOPE: moritorajis-projects
          VERCEL_PROJECT: portfolio
        run: |
          set -uo pipefail
          STATE=""
          for i in $(seq 1 40); do
            STATE="$(gh api "repos/$REPO/commits/$SHA/status" --jq '.state' 2>/dev/null)"
            echo "  Vercel の状態: ${STATE:-確認中}"
            [ "$STATE" = "success" ] && break
            [ "$STATE" = "failure" ] && break
            sleep 15
          done

          case "$STATE" in
            success) echo "state=success" >> "$GITHUB_OUTPUT" ;;
            failure) echo "state=failure" >> "$GITHUB_OUTPUT" ;;
            *)       echo "state=timeout" >> "$GITHUB_OUTPUT" ;;
          esac

          SLUG="$(printf %s "$BRANCH" | tr '/._' '---')"
          echo "preview=https://${VERCEL_PROJECT}-git-${SLUG}-${VERCEL_SCOPE}.vercel.app" >> "$GITHUB_OUTPUT"
          echo "baseline=https://${VERCEL_PROJECT}-git-develop-${VERCEL_SCOPE}.vercel.app" >> "$GITHUB_OUTPUT"

      # ビルドが通らないと見た目は比べられない。黙って終わらず、依頼者に理由を伝える
      - name: ビルドが通らなかったことを依頼に伝える
        id: build_failed
        if: steps.preview.outputs.state != 'success'
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.issue_number }}
          STATE: ${{ steps.preview.outputs.state }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$STATE" = "failure" ]; then
            REASON="サイトの組み立て（ビルド）が通りませんでした。"
          else
            REASON="待ち時間の中でプレビューが用意できませんでした。"
          fi
          {
            printf '%s\n' "## 自動チェックの結果"
            printf '%s\n' ""
            printf '%s\n' "❌ **$REASON**"
            printf '%s\n' ""
            printf '%s\n' "確認用 URL は作られていないため、見た目の比較もできていません。"
            printf '%s\n' "この修正はこのままでは取り込めません。担当者にご連絡ください。"
            printf '%s\n' ""
            printf '%s\n' "[実行の記録]($RUN_URL)"
          } > build-failed.md
          gh issue comment "$NUMBER" --repo "$REPO" --body-file build-failed.md
          exit 1

      # 🔴 依頼者が書いた文字列を ${{ }} で run: の中に展開しない。
      #    展開はシェルが読む前の文字列置換なので、`$(...)` を書かれると
      #    そのままコマンドとして実行される。この手順には合言葉が渡っているため、
      #    それを外部へ送り出すことができてしまう。
      #    値は必ず env 経由で渡し、シェル変数として引用符付きで使う。
      - name: 見た目を比べる
        id: check
        continue-on-error: true
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview }}
          BASELINE_URL: ${{ steps.preview.outputs.baseline }}
          TARGET_PATH: ${{ steps.request.outputs.target }}
          # ビルドの可否は Vercel の結果をそのまま使う。この処理自身はビルドしない。
          # なお上の手順で success 以外なら止まるため、実際は常に ok になる。
          # それでも値として渡すのは、上の手順を外したときに黙って「合格」に
          # なってしまわないようにするため。
          BUILD_STATUS: ${{ steps.preview.outputs.state == 'success' && 'ok' || 'unknown' }}
          # 実行できなかった場合は failed ではなく unknown。落ち度の所在が変わる。
          # 🔴 1行で書く。折りたたみ記法（>-）は、続きの行を深く字下げすると
          #    改行がそのまま残り、式が壊れる。
          LINT_STATUS: ${{ steps.lint.outcome == 'success' && 'ok' || steps.lint.outcome == 'failure' && 'failed' || 'unknown' }}
          # 見た目の比較が原理的に持てない手がかり（S6 の実測より）。
          # どちらも取れなかった場合は空のまま渡さず、判定側で「確かめていない」扱いにする。
          COST_USD: ${{ inputs.cost_usd }}
          REMOVED_IMPORTS: ${{ steps.imports.outputs.removed }}
          # 🔴 「調べた結果0件」と「調べられなかった」を分ける唯一の値。
          #    outcome ではなくこの値を見る。outcome は手順が失敗しても
          #    continue-on-error の下では success 以外になる経路が読みにくく、
          #    区別の根拠にすると静かに崩れる。
          IMPORTS_CHECKED: ${{ steps.imports.outputs.checked }}
        run: |
          set -uo pipefail
          ARGS=(
            --preview "$PREVIEW_URL"
            --baseline "$BASELINE_URL"
            --build-status "$BUILD_STATUS"
            --lint-status "$LINT_STATUS"
            --out visual-check-out
          )
          if [ -n "$TARGET_PATH" ]; then
            ARGS+=(--target-path "$TARGET_PATH")
          fi
          if [ -n "$COST_USD" ]; then
            ARGS+=(--cost-usd "$COST_USD")
          fi
          # 消えた読み込みは「調べて0件だった」ことにも意味があるため、
          # 調べられた場合は空文字でも渡す。渡さないこと自体が
          # 「確かめていない」を意味し、まとめにその断り書きが出る。
          if [ "$IMPORTS_CHECKED" = "true" ]; then
            ARGS+=(--removed-imports "$REMOVED_IMPORTS")
          fi
          node .github/scripts/visual-check.mjs "${ARGS[@]}"

      - name: 差分の画像を残す
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-check
          path: visual-check-out
          retention-days: 14
          if-no-files-found: ignore

      # ビルドが通らなかった場合は、上の手順がすでに理由を伝えている。
      # ここでも書くと、1つの失敗に対して食い違う説明が2つ並ぶ。
      - name: 結果を依頼に書き込む
        if: always() && steps.build_failed.conclusion == 'skipped'
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ ! -f visual-check-out/summary.md ]; then
            {
              printf '%s\n' "## 自動チェックの結果"
              printf '%s\n' ""
              printf '%s\n' "⚠️ **検査を実行できませんでした。** 判定は出ていません。"
              printf '%s\n' "取り込む前に、必ず人の目でご確認ください。"
              printf '%s\n' ""
              printf '%s\n' "[実行の記録]($RUN_URL)"
            } > visual-check-fallback.md
            gh issue comment "$NUMBER" --repo "$REPO" --body-file visual-check-fallback.md
            exit 0
          fi
          gh issue comment "$NUMBER" --repo "$REPO" --body-file visual-check-out/summary.md

      - name: 問題が見つかった場合はジョブを失敗させる
        if: steps.check.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: |
          echo "検査で問題が見つかりました。依頼への書き込みを確認してください。"
          exit 1
